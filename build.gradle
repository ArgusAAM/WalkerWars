// Сборка как в Anuken/MindustryJavaModTemplate. Поставь mindustryVersion под свою версию игры.
plugins{ id 'java' }
version = '0.1'
sourceSets.main.java.srcDirs = ['src']
repositories{ mavenCentral(); maven{ url 'https://raw.githubusercontent.com/Zelaux/Repo/master/repository' }; maven{ url 'https://jitpack.io' } }
ext{ mindustryVersion = 'v154' }
dependencies{
    compileOnly "com.github.Anuken.Arc:arc-core:$mindustryVersion"
    compileOnly "com.github.Anuken.Mindustry:core:$mindustryVersion"
}
task jarAndroid{ dependsOn jar } // для телефона: d8 из Android SDK, см. шаблон
jar{
    archiveFileName = "WalkerWars.jar"
    from(rootDir){ include 'mod.json' }
    from('assets'){ include '**' }
}
